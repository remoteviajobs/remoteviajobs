<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Via Jobs - Find Remote Jobs Worldwide</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black">
<nav class="flex justify-between items-center px-6 py-4 border-b sticky top-0 bg-white">
  <div class="font-black text-xl">🌍 REMOTE VIA JOBS</div>
  <div class="bg-black text-white px-4 py-2 rounded-full text-xs">WORLDWIDE</div>
</nav>
<section class="text-center py-20 px-6">
  <h1 class="text-6xl font-black">Find Remote Jobs<br><span class="text-blue-600">Worldwide</span></h1>
  <p class="mt-4 text-gray-600">Work from anywhere. 1000+ remote jobs updated daily.</p>
  <div class="mt-8 flex justify-center gap-2">
    <input id="search" placeholder="Search worldwide jobs..." class="border px-6 py-3 rounded-full w-80 outline-none">
    <button onclick="loadJobs()" class="bg-black text-white px-8 py-3 rounded-full font-bold">Search</button>
  </div>
</section>
<section class="bg-gray-50 py-12 px-6">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-2xl font-black mb-6">🌍 Worldwide Remote Jobs - Live</h2>
    <div id="jobs" class="grid md:grid-cols-3 gap-4">
      <div class="bg-white p-4 border rounded-xl">Loading worldwide jobs...</div>
    </div>
  </div>
</section>
<script>
async function loadJobs(){
  try{
    let res = await fetch('https://www.arbeitnow.com/api/job-board-api');
    let data = await res.json();
    let html='';
    data.data.slice(0,12).forEach(job=>{
      html+=`<div class="bg-white p-6 border rounded-2xl"><span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full">WORLDWIDE</span><h3 class="font-bold mt-3">${job.title}</h3><p class="text-sm text-gray-600">${job.company_name} - ${job.location}</p><a href="${job.url}" target="_blank" class="mt-3 inline-block bg-black text-white px-4 py-2 rounded-full text-sm">Apply Now</a></div>`;
    });
    document.getElementById('jobs').innerHTML=html;
  }catch(e){
    document.getElementById('jobs').innerHTML='Jobs loading... refresh';
  }
}
loadJobs();
</script>
<footer class="text-center py-10 text-sm text-gray-500">© 2026 Remote Via Jobs - Worldwide Remote Jobs Platform</footer>
</body>
</html>
