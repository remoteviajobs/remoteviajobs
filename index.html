<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteViaJobs - Find Remote Jobs Worldwide</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .search-box { text-align: center; margin-bottom: 20px; }
        input { padding: 10px; width: 80%; max-width: 500px; border-radius: 5px; border: 1px solid #ccc; }
        .jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .job-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .job-title { font-size: 18px; font-weight: bold; margin: 0 0 10px 0; }
        .job-company { color: #555; margin-bottom: 5px; }
        .job-location { color: #777; font-size: 14px; margin-bottom: 10px; }
        .job-salary { color: #2ecc71; font-weight: bold; margin-bottom: 15px; }
        .apply-btn { display: inline-block; background: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; text-align: center; }
        .apply-btn:hover { background: #0056b3; }
        .loading { text-align: center; font-size: 20px; color: #555; }
    </style>
</head>
<body>

    <h1>RemoteViaJobs</h1>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for job title or company..." onkeyup="filterJobs()">
    </div>
    
    <div id="loading" class="loading">Loading jobs...</div>
    <div class="jobs-container" id="jobsContainer"></div>

    <script>
        // REPLACE THE TWO LINES BELOW WITH YOUR SUPABASE INFO
        const SUPABASE_URL = 'https://xsuqoebwpuxnhjpjzysv.supabase.co' ;
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzdXFvZWJ3cHV4bmhqcGp6eXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTg4NjQsImV4cCI6MjEwNTE3NDg2NH0.fVRP2mQU_yExjbTvUJzbsHCTQnIa2JBUJcidozSIxCQ' ;

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allJobs = [];

        async function fetchJobs() {
            const { data, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching jobs:', error);
                document.getElementById('loading').innerText = 'Error loading jobs.';
                return;
            }

            allJobs = data;
            document.getElementById('loading').style.display = 'none';
            renderJobs(allJobs);
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No jobs found.</p>';
                return;
            }

            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                                card.innerHTML = `
                    <h2 class="job-title">${job.title || 'Untitled Job'}</h2>
                    <p class="job-company">${job.company || 'Unknown Company'}</p>
                    <p class="job-location">📍 ${job.location || 'Remote'}</p>
                    <p class="job-salary">${job.salary || 'Salary not specified'}</p>
                    
                    <details style="margin-bottom: 15px;">
                        <summary style="cursor: pointer; color: #007bff; font-weight: bold;">View Job Description</summary>
                        <div style="margin-top: 10px; font-size: 14px; color: #444; max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 5px;">
                            ${job.description || 'No description provided.'}
                        </div>
                    </details>

                    <a href="${job.apply_url}" target="_blank" class="apply-btn">Apply Now</a>
                `;
                `;
                container.appendChild(card);
            });
        }

        function filterJobs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allJobs.filter(job => 
                (job.title && job.title.toLowerCase().includes(query)) || 
                (job.company && job.company.toLowerCase().includes(query))
            );
            renderJobs(filtered);
        }

        // Run the fetch when the page loads
        fetchJobs();
    </script>
</body>
</html>
